<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yatharth Bhati</title>
<meta name="description" content="Yatharth Bhati's portfolio of engineering projects.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f4f6f5; --surface:#ffffff; --ink:#13211d; --muted:#56645f; --line:#dde4e1;
  --accent:#0d7a5d; --accent-soft:#e1f1ea;
  --f-display:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --f-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.6}
main{max-width:860px;margin:0 auto;padding:clamp(48px,10vw,112px) 20px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2.6rem,8vw,4.5rem);line-height:1.05;margin:0 0 12px}
.lede{color:var(--muted);font-size:1.15rem;max-width:42ch;margin:0 0 56px}
h2{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;color:inherit;text-decoration:none;transition:transform .15s,border-color .15s}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--accent)}
.tag{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:.75rem;font-weight:600;padding:2px 10px;border-radius:99px;margin-bottom:12px}
.card h3{font-family:var(--f-display);font-weight:400;font-size:1.7rem;line-height:1.15;margin:0 0 8px}
.card p{margin:0;color:var(--muted);font-size:.95rem}
</style>
</head>
<body>
<main>
  <h1>Yatharth Bhati</h1>
  <p class="lede">I'm 14 and I build low-cost engineering projects. Here's what I've made.</p>
  <h2>Projects</h2>
  <div class="grid">
    <a class="card" href="projects/airpurifieratmwl/">
      <span class="tag">DIY · Air quality</span>
      <h3>airpurifieratmwl</h3>
      <p>A ₹2,000 DIY air purifier that works like the expensive ones.</p>
    </a>
  </div>
</main>
</body>
</html>
